<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RADIOTIVI</title>
  <meta name="theme-color" content="#2ecc71">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ========== LOGIN VIEW ========== -->
  <div id="viewLogin" class="view-login">
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-logo-btn">
            <svg class="login-icon" viewBox="0 0 100 100" fill="white">
              <circle cx="50" cy="50" r="38" fill="white"/>
              <path d="M41 34 L66 50 L41 66 Z" fill="#2ecc71"/>
            </svg>
          </div>
          <h1 class="login-title">RADIOTIVI</h1>
        </div>
        <button class="btn-google" id="btnGoogleLogin">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Iniciar sesi&oacute;n
        </button>
      </div>
    </div>
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="viewApp" class="view-app hidden">
    <div id="app">
      <header>
        <div class="header-inner">
          <div class="header-left">
            <button class="btn-back" id="btnBack" aria-label="Volver">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <div class="header-brand">
              <button class="header-logo-btn" id="btnLogo" aria-label="RADIOTIVI">
                <svg viewBox="0 0 100 100" fill="white" style="width:24px;height:24px">
                  <circle cx="50" cy="50" r="38" fill="white"/>
                  <path d="M41 34 L66 50 L41 66 Z" fill="#2ecc71"/>
                </svg>
              </button>
              <h1 id="headerTitle">RADIOTIVI</h1>
            </div>
          </div>
        </div>
      </header>

      <div class="main-content" id="mainContent">

        <!-- ===== VIEW: RADIO ===== -->
        <div id="viewRadio" class="view active">
          <div class="filters-row">
            <button class="btn-favonly" id="radioFavOnly" aria-pressed="false" aria-label="Favoritos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>
            <select id="radioCountrySelect" class="filter-select">
              <option value="">Pa&iacute;s</option>
            </select>
            <select id="radioCatSelect" class="filter-select">
              <option value="">Categor&iacute;a</option>
            </select>
            <input type="text" id="radioSearch" class="filter-search" placeholder="Buscar...">
          </div>
          <div class="count-bar" id="radioCount"></div>
          <div id="radioResults" class="results-list"></div>
          <div id="radioEmpty" class="empty-state">
            <div class="empty-content">
              <span class="empty-icon">&#x1F3A7;</span>
              <p class="empty-text">Cargando emisoras...</p>
              <p class="empty-sub">Se est&aacute;n obteniendo las emisoras de Espa&ntilde;a</p>
            </div>
          </div>
        </div>

        <!-- ===== VIEW: TV ===== -->
        <div id="viewTv" class="view">
          <div class="filters-row">
            <button class="btn-favonly" id="tvFavOnly" aria-pressed="false" aria-label="Favoritos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg></button>
            <button class="cast-btn" id="castBtn" aria-label="Conectar o desconectar Google Cast" title="Conectar o desconectar Google Cast">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="12" rx="2"/>
                <path d="M2 20h2"/><path d="M7 20a5 5 0 0 1 5-5"/><path d="M7 16a4 4 0 0 1 4 4"/><path d="M7 20h2"/>
              </svg>
            </button>
            <select id="tvCountrySelect" class="filter-select">
              <option value="">Pa&iacute;s</option>
            </select>
            <select id="tvGroupSelect" class="filter-select">
              <option value="">Categor&iacute;a</option>
            </select>
            <input type="text" id="tvSearch" class="filter-search" placeholder="Buscar...">
          </div>
          <div class="count-bar" id="tvCount"></div>
          <div class="load-status" id="tvStatus"></div>
          <div id="tvResults" class="results-list"></div>
          <div id="tvEmpty" class="empty-state">
            <div class="empty-content">
              <span class="empty-icon">&#x1F4FA;</span>
              <p class="empty-text">Cargando canales</p>
              <p class="empty-sub">Se est&aacute; obteniendo la lista de canales</p>
            </div>
          </div>
        </div>

        <!-- ===== VIEW: USUARIOS ===== -->
        <div id="viewUsuarios" class="view">
          <div class="players-list" id="usuariosList"></div>
        </div>

      </div>

      <!-- Bottom navigation -->
      <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-view="radio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 4.5v15M8.5 7h4M8.5 10h4"/>
          </svg>
          <span>Radio</span>
        </button>
        <button class="nav-item" data-view="tv">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="13" rx="2"/><polyline points="17 2 12 7 7 2"/>
          </svg>
          <span>TV</span>
        </button>
      </nav>

      <!-- Fixed audio player (radio) -->
      <div class="audio-player hidden" id="audioPlayer">
        <button class="audio-toggle" id="audioToggle" aria-label="Reproducir/Pausar">
          <svg id="audioIconPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="audioIconPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <div class="audio-info">
          <div class="audio-title" id="audioTitle">Titulo</div>
          <div class="audio-meta" id="audioMeta">En directo</div>
        </div>
        <button class="audio-close" id="audioClose" aria-label="Cerrar reproductor">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div id="toast"></div>
    </div>
  </div>

  <!-- ========== FAB ========== -->
  <button class="fab" id="fabAdd" aria-label="A&ntilde;adir">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- ========== TV VIDEO MODAL ========== -->
  <div id="videoModal" class="modal">
    <div class="modal-overlay" id="videoModalOverlay"></div>
    <div class="modal-panel video-panel">
      <div class="video-header">
        <div class="video-title" id="videoTitle">Canal</div>
        <button class="modal-close" id="videoModalClose" aria-label="Cerrar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="video-container">
        <video id="videoPlayer" controls playsinline autoplay disableRemotePlayback></video>
      </div>
      <div class="video-status" id="videoStatus"></div>
    </div>
  </div>

  <!-- ========== USER MODAL ========== -->
  <div class="modal" id="modalUsuario">
    <div class="modal-overlay" id="modalUsuarioOverlay"></div>
    <div class="modal-panel" id="modalUsuarioPanel">
      <div class="modal-header">
        <h2 id="usuarioModalTitle">Nuevo usuario</h2>
        <div class="modal-header-actions">
          <button class="modal-header-btn modal-header-btn-save" aria-label="Guardar usuario" type="submit" form="usuarioForm">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
          </button>
          <button class="modal-close" id="modalUsuarioClose" aria-label="Cerrar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <form id="usuarioForm" autocomplete="off">
        <input type="hidden" id="editUsuarioEmail">
        <div class="form-group">
          <label for="inviteEmail">Email</label>
          <input type="email" id="inviteEmail" placeholder="Email del usuario" required autofocus>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== CONFIRM MODAL ========== -->
  <div class="modal modal-confirm" id="modalConfirm">
    <div class="modal-overlay" id="modalConfirmOverlay"></div>
    <div class="modal-panel confirm-panel" id="modalConfirmPanel">
      <div class="confirm-icon" id="confirmIcon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <div class="confirm-text" id="confirmText">&iquest;Est&aacute;s seguro?</div>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" id="btnConfirmCancel">Cancelar</button>
        <button class="btn-confirm-ok" id="btnConfirmOk">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
  window['__onGCastApiAvailable'] = function(isAvailable) {
    window.__CAST_AVAIL_RAW__ = isAvailable;
    if (typeof castReadySafe === 'function') { castReadySafe(); }
  };
</script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script src="script.js"></script>
</body>
</html>
