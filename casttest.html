<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Test — RADIOTIVI</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #101418; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { max-width: 460px; text-align: center; line-height: 1.5; color: #c8cdd3; margin: 6px 0; }
    button { background: #2ecc71; color: #10221a; border: 0; border-radius: 24px; font-size: 16px; font-weight: 700; padding: 14px 30px; margin: 16px 0; cursor: pointer; }
    button.active { background: #e67e22; }
    #status { margin-top: 8px; font-size: 14px; min-height: 20px; color: #8ecbff; }
    select { background: #22272e; color: #eee; border: 1px solid #3a424b; border-radius: 8px; padding: 8px 10px; font-size: 14px; margin: 6px 0 14px; }
    pre { background: #1a1f26; border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; max-width: 480px; white-space: pre-wrap; word-break: break-all; color: #b7f0c2; }
  </style>
</head>
<body>
  <h1>Cast Test</h1>
  <p>Página mínima para probar el núcleo de Cast (Default Media Receiver CC1AD845) con un vídeo conocido.</p>
  <pre id="log">iniciando...</pre>
  <select id="media">
    <option value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">MP4 — Big Buck Bunny</option>
    <option value="https://storage.googleapis.com/shaka-demo-assets/angel-one-hls/hls.m3u8">HLS — Angel One (Shaka demo)</option>
    <option value="https://storage.googleapis.com/shaka-demo-assets/sintel-hls/hls.m3u8">HLS — Sintel (Shaka demo)</option>
  </select>
  <br>
  <button id="castBtn" onclick="toggleCast()">Proyectar a TV</button>
  <div id="status"></div>

  <script>
  var castAvailable = false;
  var castContext = null;
  var castSession = null;
  var connecting = false;

  window['__onGCastApiAvailable'] = function(isAvailable) {
    if (isAvailable) { initializeCastApi(); }
    else { log('Cast API NO disponible en este navegador'); }
  };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script>
  function log(t) {
    var el = document.getElementById('log');
    if (el) el.textContent = '> ' + t + (el.textContent.indexOf('iniciando') === -1 ? '\n' + el.textContent : '');
  }
  function status(t) {
    var el = document.getElementById('status');
    if (el) el.textContent = t;
  }
  function initializeCastApi() {
    castAvailable = true;
    log('Cast API disponible.');
    var ctx = cast.framework.CastContext.getInstance();
    ctx.setOptions({
      receiverApplicationId: 'CC1AD845',
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });
    castContext = ctx;
    var sm = cast.framework.CastContext.getInstance().getSessionManager();
    sm.addEventListener(cast.framework.SessionManagerEventType.SESSION_STARTED, function() {
      castSession = castContext.getCurrentSession();
      connecting = false;
      status('Sesión iniciada: ' + (castSession && castSession.getCastDevice().friendlyName));
      loadMedia();
    });
    sm.addEventListener(cast.framework.SessionManagerEventType.SESSION_START_FAILED, function(ev) {
      connecting = false;
      status('Fallo al conectar: ' + (ev && ev.error ? ev.error.code : 'desconocido'));
    });
    log('Listo. Pulsa "Proyectar a TV".');
  }
  function toggleCast() {
    var btn = document.getElementById('castBtn');
    if (castSession && castSession.getSessionState() === cast.framework.SessionState.SESSION_STARTED) {
      castContext.endCurrentSession(true);
      castSession = null;
      btn.textContent = 'Proyectar a TV';
      status('');
      return;
    }
    if (!castAvailable) { status('Cast no disponible en este navegador'); return; }
    connecting = true;
    status('Buscando dispositivo...');
    castContext.requestSession().then(
      function() {
        if (!castSession) { castSession = castContext.getCurrentSession(); }
        connecting = false;
        status('Conectado.');
        loadMedia();
      },
      function(err) {
        connecting = false;
        status('Error: ' + (err && err.code ? err.code : 'desconocido'));
      }
    );
  }
  function loadMedia() {
    if (!castSession) { status('No hay sesión Cast.'); return; }
    var url = document.getElementById('media').value;
    var isHls = /\.m3u8/i.test(url);
    var ct = isHls ? 'application/x-mpegURL' : 'video/mp4';
    log('Enviando: ' + url);
    status('Enviando a la TV (' + ct + ')...');
    var mi = new chrome.cast.media.MediaInfo(url, ct);
    var req = new chrome.cast.media.LoadRequest(mi);
    castSession.loadMedia(req).then(
      function() {
        status('Reproduciendo en la TV.');
        document.getElementById('castBtn').textContent = 'Detener proyección';
        document.getElementById('castBtn').classList.add('active');
      },
      function(err) {
        status('Falló loadMedia: ' + (err && err.code ? err.code : 'desconocido'));
      }
    );
  }
  </script>
</body>
</html>
